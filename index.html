<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Login Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #212121;
            --primary-color: #ff3366;
            --primary-dark: #cc0033;
            --surface-color: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --shadow-color: #111111;
            --highlight-color: #3a3a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 51, 102, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(51, 204, 255, 0.1), transparent 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow: hidden;
            perspective: 1000px; /* Essential for 3D effects */
        }

        .form-container {
            width: 400px;
            padding: 40px;
            background: var(--surface-color);
            border-radius: 20px;
            
            /* 3D Box Shadow for thickness */
            box-shadow: 
                10px 10px 0 var(--shadow-color),
                10px 10px 20px rgba(0,0,0,0.5),
                inset 2px 2px 0 var(--highlight-color),
                inset -2px -2px 0 var(--shadow-color);
                
            /* 3D Transform */
            transform: rotateX(10deg) rotateY(-10deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .form-container:hover {
            transform: rotateX(0deg) rotateY(0deg) translateZ(20px);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            transform: translateZ(30px); /* Pops out of the card */
        }

        .form-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-color);
            text-shadow: 3px 3px 0 var(--primary-color), 6px 6px 0 var(--shadow-color);
        }

        .form-group {
            margin-bottom: 25px;
            transform: translateZ(20px);
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            background: var(--bg-color);
            border: none;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            
            /* Inset shadow to look carved in */
            box-shadow: 
                inset 5px 5px 10px var(--shadow-color),
                inset -5px -5px 10px var(--highlight-color);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 
                inset 5px 5px 10px var(--shadow-color),
                inset -5px -5px 10px var(--highlight-color),
                0 0 10px rgba(255, 51, 102, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            outline: none;
            
            /* Chunky 3D button */
            box-shadow: 
                0 6px 0 var(--primary-dark),
                0 15px 20px rgba(0,0,0,0.4),
                inset 2px 2px 0 rgba(255,255,255,0.3);
                
            transform: translateZ(40px); /* Pops out significantly */
            transition: all 0.1s ease;
            position: relative;
            top: 0;
        }

        .submit-btn:active {
            top: 6px; /* Moves down to cover the dark shadow */
            box-shadow: 
                0 0px 0 var(--primary-dark),
                0 5px 10px rgba(0,0,0,0.4),
                inset 2px 2px 0 rgba(255,255,255,0.3);
            transform: translateZ(34px);
        }

        /* Floating particles or decorative 3D elements in the background */
        .cube {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(51, 204, 255, 0.8);
            border-radius: 10px;
            box-shadow: 
                10px 10px 0 #1882a8,
                inset 2px 2px 0 rgba(255,255,255,0.5);
            z-index: -1;
            animation: float 6s ease-in-out infinite;
        }

        .cube1 {
            top: 15%;
            left: 20%;
            transform: rotateZ(45deg) rotateX(20deg) translateZ(-50px);
        }

        .cube2 {
            bottom: 20%;
            right: 20%;
            width: 40px;
            height: 40px;
            background: rgba(255, 204, 51, 0.8);
            box-shadow: 
                8px 8px 0 #cc9900,
                inset 2px 2px 0 rgba(255,255,255,0.5);
            animation-delay: -3s;
            transform: rotateZ(-25deg) rotateX(30deg) translateZ(-80px);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotateZ(45deg) rotateX(20deg) translateZ(-50px);
            }
            50% {
                transform: translateY(-20px) rotateZ(50deg) rotateX(30deg) translateZ(-30px);
            }
        }
    </style>
</head>
<body>

    <div class="cube cube1"></div>
    <div class="cube cube2" style="animation: float2 5s ease-in-out infinite;"></div>

    <style>
        @keyframes float2 {
            0%, 100% { transform: translateY(0) rotateZ(-25deg) rotateX(30deg) translateZ(-80px); }
            50% { transform: translateY(-15px) rotateZ(-15deg) rotateX(20deg) translateZ(-60px); }
        }
    </style>

    <div class="form-container">
        <div class="form-header">
            <h1>Login</h1>
        </div>
        <form onsubmit="event.preventDefault(); alert('Logged in!');">
            <div class="form-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="submit-btn">SIGN IN</button>
        </form>
    </div>

    <script>
        // Optional: Interactive 3D tilt effect on mousemove
        const container = document.querySelector('.form-container');
        
        document.addEventListener('mousemove', (e) => {
            // Only apply when the card is hovered so it doesn't conflict with the hover transition
            if (!container.matches(':hover')) return;

            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg) translateZ(20px)`;
        });

        // Reset transform on mouse leave
        document.addEventListener('mouseleave', () => {
            container.style.transform = `rotateX(10deg) rotateY(-10deg)`;
        });
    </script>
</body>
</html>
