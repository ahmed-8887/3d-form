<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism 3D Login Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
            overflow: hidden;
        }

        /* Animated Background Gradients */
        .color-blob {
            position: absolute;
            filter: blur(150px);
            z-index: 1;
        }

        .blob-1 {
            top: -100px;
            left: 10%;
            width: 400px;
            height: 400px;
            background: #3b82f6; /* Blue */
            animation: moveBlob 10s ease-in-out infinite alternate;
        }

        .blob-2 {
            bottom: -50px;
            right: 10%;
            width: 500px;
            height: 500px;
            background: #ec4899; /* Pink */
            animation: moveBlob 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* 3D Glass Container */
        .glass-container {
            position: relative;
            z-index: 10;
            width: 380px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            
            /* 3D Shadow effects */
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.2),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 10px 20px rgba(255, 255, 255, 0.05);
                
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h2 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .form-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .input-group input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 
                inset 0 3px 6px rgba(0, 0, 0, 0.2),
                0 0 15px rgba(59, 130, 246, 0.3);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-group label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s;
        }

        /* Floating label animation */
        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -10px;
            left: 15px;
            font-size: 0.8rem;
            background: #0f172a; /* Match body bg to hide line */
            padding: 0 5px;
            color: #3b82f6;
            border-radius: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            transform: translateZ(20px); /* 3D pop */
        }

        .btn-submit:hover {
            transform: translateY(-2px) translateZ(20px);
            box-shadow: 0 15px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-submit:active {
            transform: translateY(2px) translateZ(10px);
            box-shadow: 0 5px 10px rgba(59, 130, 246, 0.3);
        }

        /* Interactive 3D tilt */
        .glass-container {
            transition: transform 0.1s ease;
        }

        .forgot-pass {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-pass a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .forgot-pass a:hover {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>

    <div class="glass-container" id="card">
        <div class="form-header">
            <h2>Welcome Back</h2>
            <p>Please enter your details</p>
        </div>
        <form onsubmit="event.preventDefault(); alert('Login Successful!');">
            <div class="input-group">
                <input type="text" id="email" required autocomplete="off">
                <label for="email">Email address</label>
            </div>
            <div class="input-group">
                <input type="password" id="pass" required>
                <label for="pass">Password</label>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
            <div class="forgot-pass">
                <a href="#">Forgot your password?</a>
            </div>
        </form>
    </div>

    <script>
        const card = document.getElementById('card');
        
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = `transform 0.5s ease`;
        });

        document.addEventListener('mouseenter', () => {
            card.style.transition = `none`;
        });
    </script>

</body>
</html>
